                - Arquitectura de una aplicación web: 1.fundamentos/2.arquitectura-aplicacion-web.md
                - Protocolo HTTP: 1.fundamentos/3.protocolo-http.md
                - Cookies y sesiones: 1.fundamentos/4.cookies-sesiones.md
                - HTTPS y certificados digitales: 1.fundamentos/5.https-certificados.md
                - Herramientas de análisis web: 1.fundamentos/6.herramientas-analisis-web.md
                - Conclusiones: 1.fundamentos/7.conclusiones.md
                - Actividades:
