site_name: DAW Desarrollo Web Seguro
site_url: https://jminsausti.github.io/Plantilla_mkdocs_es-eu
site_description: Desarrollo Web Seguro - CFGS Desarrollo de Aplicaciones Web
site_author: Jose Insausti - CIFP Txurdinaga LHII

docs_dir: docs
use_directory_urls: true

theme:
  name: material
  language: es
  logo: images/Icono_TX.png
  favicon: http://fptxurdinaga.eus/wp-content/uploads/2022/10/favicon-96x96-1.png
  custom_dir: overrides

  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
  - scripts/checkboxes.js

plugins:
  - search

  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: false
      fallback_to_default: true

      languages:

        - locale: es
          default: true
          name: Español

          nav:
            - Inicio: index.md

            - Proyecto de referencia:
              - Presentación del proyecto: 0.proyecto/index.md
              - TxurdiGest: 0.proyecto/txurdigest.md

            - Bloque 1. Fundamentos:
                - Presentación del bloque: 1.fundamentos/index.md
                - Introducción al desarrollo web seguro: 1.fundamentos/1.introduccion-desarrollo-web-seguro.md
                - Arquitectura de una aplicación web: 1.fundamentos/2.arquitectura-aplicacion-web.md
                - Protocolo HTTP: 1.fundamentos/3.protocolo-http.md
                - Cookies, sesiones y gestión del estado: 1.fundamentos/4.cookies-sesiones.md
                - HTTPS y certificados digitales: 1.fundamentos/5.https-certificados.md
                - Herramientas de análisis web: 1.fundamentos/6.herramientas-analisis-web.md
                - Resumen del bloque: 1.fundamentos/7.resumen.md

            - Bloque 2. Desarrollo seguro:
              - Presentación del bloque: 2.desarrollo-seguro/index.md
              - Introducción al desarrollo seguro: 2.desarrollo-seguro/1.introduccion-desarrollo-seguro.md
              - Validación de entradas: 2.desarrollo-seguro/2.validacion-de-entradas.md
              - Gestión de errores: 2.desarrollo-seguro/3.gestion-de-errores.md
              - Autenticación: 2.desarrollo-seguro/4.autenticacion.md
              - Autorización: 2.desarrollo-seguro/5.autorizacion.md
              - Gestión de secretos y configuración: 2.desarrollo-seguro/6.gestion-de-secretos-y-configuracion.md
              - Resumen del bloque: 2.desarrollo-seguro/7.resumen.md

            - Actividades:
              - Bloque 1:
                - Actividades del bloque 1: actividades/bloque1/index.md
                - Introducción al desarrollo web seguro: actividades/bloque1/1.introduccion-desarrollo-web-seguro.md
                - Arquitectura de una aplicación web: actividades/bloque1/2.arquitectura-aplicacion-web.md
                - Protocolo HTTP: actividades/bloque1/3.protocolo-http.md
                - Cookies y sesiones: actividades/bloque1/4.cookies-sesiones.md
                - HTTPS y certificados: actividades/bloque1/5.https-certificados.md
                - Herramientas de análisis web: actividades/bloque1/6.herramientas-analisis-web.md
                - Resumen del bloque: actividades/bloque1/7.resumen.md
              - Bloque 2:
                - Actividades del bloque 2: actividades/bloque2/index.md

        - locale: eu
          name: Euskara

          nav:
            - Hasiera: index.md

            - Erreferentziazko proiektua:
                - Proiektuaren aurkezpena: 0.proyecto/index.md
                - TxurdiGest: 0.proyecto/txurdigest.md

            - 1. blokea. Web garapen seguruaren oinarriak:
                - Blokearen aurkezpena: 1.fundamentos/index.md
                - Garapen web seguruaren sarrera: 1.fundamentos/1.introduccion-desarrollo-web-seguro.md
                - Web aplikazio baten arkitektura: 1.fundamentos/2.arquitectura-aplicacion-web.md
                - HTTP protokoloa: 1.fundamentos/3.protocolo-http.md
                - Cookieak, saioak eta egoeraren kudeaketa: 1.fundamentos/4.cookies-sesiones.md
                - HTTPS eta ziurtagiri digitalak: 1.fundamentos/5.https-certificados.md
                - Web analisi tresnak: 1.fundamentos/6.herramientas-analisis-web.md
                - Blokearen laburpena: 1.fundamentos/7.resumen.md

            - 2. blokea. Web aplikazioen garapen segurua:
              - Blokearen aurkezpena: 2.desarrollo-seguro/index.md
              - Garapen seguruaren sarrera: 2.desarrollo-seguro/1.introduccion-desarrollo-seguro.md
              - Sarreren balidazioa: 2.desarrollo-seguro/2.validacion-de-entradas.md
              - Erroreen kudeaketa: 2.desarrollo-seguro/3.gestion-de-errores.md
              - Autentifikazioa: 2.desarrollo-seguro/4.autenticacion.md
              - Baimen-kudeaketa: 2.desarrollo-seguro/5.autorizacion.md
              - Sekretuen eta konfigurazioaren kudeaketa: 2.desarrollo-seguro/6.gestion-de-secretos-y-configuracion.md
              - Blokearen laburpena: 2.desarrollo-seguro/7.resumen.md

            - Jarduerak:
              - 1. blokea:
                - 1. blokeko jarduerak: actividades/bloque1/index.md
                - Web garapen seguruaren sarrera: actividades/bloque1/1.introduccion-desarrollo-web-seguro.md
                - Web aplikazio baten arkitektura: actividades/bloque1/2.arquitectura-aplicacion-web.md
                - HTTP protokoloa: actividades/bloque1/3.protocolo-http.md
                - Cookieak eta saioak: actividades/bloque1/4.cookies-sesiones.md
                - HTTPS eta ziurtagiriak: actividades/bloque1/5.https-certificados.md
                - Web analisi-tresnak: actividades/bloque1/6.herramientas-analisis-web.md
                - Blokearen laburpena: actividades/bloque1/7.resumen.md
              - 2. blokea:
                - 2. blokeko jarduerak: actividades/bloque2/index.md

markdown_extensions:

  - admonition

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      clickable_checkbox: true
      custom_checkbox: true

  - pymdownx.keys

  - pymdownx.mark

  - pymdownx.critic

  - attr_list

  - md_in_html

  - tables

  - footnotes

  - toc:
      permalink: true