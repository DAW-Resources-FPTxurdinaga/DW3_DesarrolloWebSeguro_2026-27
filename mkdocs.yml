site_name: DAW Desarrollo Web Seguro
site_url: https://jminsausti.github.io/Plantilla_mkdocs_es-eu
site_description: Desarrollo Web Seguro - CFGS Desarrollo de Aplicaciones Web
site_author: Jose Insausti - CIFP Txurdinaga LHII

docs_dir: docs
use_directory_urls: false

theme:
  name: material
  language: es
  logo: images/Icono_TX.png
  favicon: http://fptxurdinaga.eus/wp-content/uploads/2022/10/favicon-96x96-1.png
  custom_dir: overrides

  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
  - scripts/checkboxes.js

plugins:
  - search

  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: false
      fallback_to_default: true

      languages:

        - locale: es
          default: true
          name: Español

          nav:
            - Inicio: index.md

            - Proyecto de referencia:
              - Presentación del proyecto: 0.proyecto/index.md
              - TxurdiGest: 0.proyecto/txurdigest.md
              - Glosario: 0.proyecto/glosario.md

            - Bloque 1. Fundamentos:
