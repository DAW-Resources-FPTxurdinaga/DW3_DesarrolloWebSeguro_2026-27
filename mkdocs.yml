markdown_extensions:

  - admonition

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      clickable_checkbox: true
      custom_checkbox: true

  - pymdownx.keys

  - pymdownx.mark

  - pymdownx.critic

  - attr_list

  - md_in_html

  - tables

  - footnotes

  - toc:
      permalink: true