site_name: DAW Desarrollo Web Seguro
site_url: https://jminsausti.github.io/Plantilla_mkdocs_es-eu
site_description: Desarrollo Web Seguro - CFGS Desarrollo de Aplicaciones Web
site_author: Jose Insausti - CIFP Txurdinaga LHII

docs_dir: docs
use_directory_urls: false

theme:
  name: material
  language: es
  logo: images/Icono_TX.png
  favicon: http://fptxurdinaga.eus/wp-content/uploads/2022/10/favicon-96x96-1.png
  custom_dir: overrides

  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
  - scripts/checkboxes.js

plugins:
  - search

  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: false
      fallback_to_default: true

      languages:

        - locale: es
          default: true
          name: Español

          nav:
            - Inicio: index.md

            - Proyecto de referencia:
              - Presentación del proyecto: 0.proyecto/index.md
              - TxurdiGest: 0.proyecto/txurdigest.md
              - Glosario: 0.proyecto/glosario.md

            - Bloque 1. Fundamentos:
                - 1.fundamentos/index.md
                - Introducción: 1.fundamentos/1.introduccion-desarrollo-web-seguro.md
                - Arquitectura de una aplicación web: 1.fundamentos/2.arquitectura-aplicacion-web.md
                - Protocolo HTTP: 1.fundamentos/3.protocolo-http.md
                - Cookies y sesiones: 1.fundamentos/4.cookies-sesiones.md
                - HTTPS y certificados digitales: 1.fundamentos/5.https-certificados.md
                - Herramientas de análisis web: 1.fundamentos/6.herramientas-analisis-web.md
                - Conclusiones: 1.fundamentos/7.conclusiones.md
                - Actividades:
                  - 1.fundamentos/actividades/index.md
                  - Observar una aplicación web con DevTools: 1.fundamentos/actividades/1.observar-aplicacion-devtools.md
                  - Aplicación rápida al reto: 1.fundamentos/actividades/2.aplicacion-reto.md

            - Bloque 2. Desarrollo seguro:
              - Inicio: 2.desarrollo-seguro/index.md
              - Introducción al desarrollo seguro: 2.desarrollo-seguro/1.introduccion-desarrollo-seguro.md
              - Validación de entradas: 2.desarrollo-seguro/2.validacion-de-entradas.md
              - Gestión de errores: 2.desarrollo-seguro/3.gestion-de-errores.md
              - Autenticación: 2.desarrollo-seguro/4.autenticacion.md
              - Autorización: 2.desarrollo-seguro/5.autorizacion.md
              - Gestión de secretos y configuración: 2.desarrollo-seguro/6.gestion-de-secretos-y-configuracion.md
              - Conclusiones: 2.desarrollo-seguro/7.conclusiones.md
              - Actividades:
                - 2.desarrollo-seguro/actividades/index.md
                - Diseñar un formulario seguro: 2.desarrollo-seguro/actividades/01-disenar-formulario-seguro.md
                - Diseñar el acceso a la aplicación: 2.desarrollo-seguro/actividades/02-disenar-acceso-aplicacion.md
                - Diseñar una configuración segura: 2.desarrollo-seguro/actividades/03-disenar-configuracion-segura.md
                - Revisar el diseño de seguridad del proyecto: 2.desarrollo-seguro/actividades/04-revision-diseno-seguridad.md

            - Bloque 3. Implementación segura:
              - Inicio: 3.implementacion-segura/index.md
              - Introducción a la implementación segura: 3.implementacion-segura/1.introduccion-implementacion-segura.md
              - Validación de entradas:
                - Introducción: 3.implementacion-segura/2.validacion-entradas/index.md
                - JavaScript: 3.implementacion-segura/2.validacion-entradas/javascript.md
                - PHP: 3.implementacion-segura/2.validacion-entradas/php.md
                - Laboratorio: 3.implementacion-segura/2.validacion-entradas/laboratorio.md
              - Salida segura y XSS:
                - Introducción: 3.implementacion-segura/3.salida-segura-xss/index.md
                - Implementación: 3.implementacion-segura/3.salida-segura-xss/implementacion.md
                - Laboratorio DVWA: 3.implementacion-segura/3.salida-segura-xss/laboratorio-dvwa.md
              - Acceso seguro a datos y SQL Injection:
                - Introducción: 3.implementacion-segura/4.acceso-datos-sql-injection/index.md
                - PHP y consultas preparadas: 3.implementacion-segura/4.acceso-datos-sql-injection/php-consultas-preparadas.md
                - Laboratorio DVWA: 3.implementacion-segura/4.acceso-datos-sql-injection/laboratorio-dvwa.md
              - Autenticación y sesiones:
                - Introducción: 3.implementacion-segura/5.autenticacion-sesiones/index.md
                - Implementación: 3.implementacion-segura/5.autenticacion-sesiones/implementacion.md
              - Autorización:
                - Introducción: 3.implementacion-segura/6.autorizacion/index.md
                - Implementación: 3.implementacion-segura/6.autorizacion/implementacion.md
              - Subida segura de archivos:
                - Introducción: 3.implementacion-segura/7.subida-segura-archivos/index.md
                - Implementación: 3.implementacion-segura/7.subida-segura-archivos/implementacion.md
                - Laboratorio DVWA: 3.implementacion-segura/7.subida-segura-archivos/laboratorio-dvwa.md
              - APIs web y CORS:
                - Introducción: 3.implementacion-segura/8.apis-web-cors/index.md
                - Implementación: 3.implementacion-segura/8.apis-web-cors/implementacion.md
              - Conclusiones: 3.implementacion-segura/9.conclusiones.md
              - Actividades: 3.implementacion-segura/actividades/index.md

            - Bloque 4. Despliegue seguro:
              - Presentación del bloque: 4.despliegue-seguro/index.md

            - Bloque 5. Verificación de la seguridad:
              - Presentación del bloque: 5.verificacion-seguridad/index.md

        - locale: eu
          name: Euskara

          nav:
            - Hasiera: index.md

            - Erreferentziazko proiektua:
                - Proiektuaren aurkezpena: 0.proyecto/index.md
                - TxurdiGest: 0.proyecto/txurdigest.md
                - Glosarioa: 0.proyecto/glosario.md

            - 1. blokea. Web garapen seguruaren oinarriak:
