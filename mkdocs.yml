                - Sarrera: 1.fundamentos/1.introduccion-desarrollo-web-seguro.md
                - Web aplikazio baten arkitektura: 1.fundamentos/2.arquitectura-aplicacion-web.md
                - HTTP protokoloa: 1.fundamentos/3.protocolo-http.md
                - Cookieak eta saioak: 1.fundamentos/4.cookies-sesiones.md
                - HTTPS eta ziurtagiri digitalak: 1.fundamentos/5.https-certificados.md
                - Web analisi tresnak: 1.fundamentos/6.herramientas-analisis-web.md
                - Ondorioak: 1.fundamentos/7.conclusiones.md
                - Jarduerak:
                  - 1.fundamentos/actividades/index.md
                  - Web aplikazio bat DevTools-ekin behatzea: 1.fundamentos/actividades/1.observar-aplicacion-devtools.md
