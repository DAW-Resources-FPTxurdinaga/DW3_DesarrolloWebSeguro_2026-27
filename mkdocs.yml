site_name: DAW Desarrollo Web Seguro
site_url: https://jminsausti.github.io/Plantilla_mkdocs_es-eu
site_description: Apuntes bilingues del modulo optativo Desarrollo Web Seguro
site_author: Jose Insausti - CIFP Txurdinaga LHII
docs_dir: docs
use_directory_urls: true
theme:
  name: material
  language: es
  logo: images/Icono_TX.png
  favicon: http://fptxurdinaga.eus/wp-content/uploads/2022/10/favicon-96x96-1.png
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.expand
  palette:
    - scheme: default
      primary: '#004c95'
      accent: '#e95f15'
      toggle:
        icon: material/brightness-7
        name: Aldatu modu ilunera
    - scheme: slate
      primary: '#004c95'
      accent: '#e95f15'
      toggle:
        icon: material/brightness-4
        name: Aldatu modu argira
extra_css:
- stylesheets/extra.css
extra_javascript:
- scripts/checkboxes.js
- javascripts/sidebar.js
plugins:
- search
- i18n:
    docs_structure: folder
    reconfigure_material: true
    reconfigure_search: true
    fallback_to_default: true
    languages:
      - locale: es
        name: Español
        default: true
        nav:
          - Inicio: index.md
          - 0. Presentación: 0.presentacion/index.md
          - 1. Fundamentos: 1.fundamentos/index.md
          - 2. Análisis de la aplicación: 2.analisis-aplicacion/index.md
          - 3. Entrada y salida de datos: 3.entrada-salida-datos/index.md
          - 4. Formularios y CSRF: 4.formularios-csrf/index.md
          - 5. Base de datos: 5.base-datos/index.md
          - 6. Autenticación y autorización: 6.autenticacion-autorizacion/index.md
          - 7. Despliegue seguro: 7.despliegue-seguro/index.md
          - 8. Auditoría y verificación: 8.auditoria-verificacion/index.md
          - 9. Laravel: 9.laravel/index.md
          - 10. Recursos: 10.recursos/index.md
          - 11. Anexos: 11.anexos/index.md
            
      - locale: eu
        name: Euskara
        nav:
          - Hasiera: index.md
          - 0. Sarrera: 0.sarrera/index.md
          - 1. Oinarriak: 1.oinarriak/index.md
          - 2. Aplikazioaren analisia: 2.aplikazioaren-analisi/index.md
          - 3. Datuen sarrera eta irteera: 3.datuen-sarrera-irteera/index.md
          - 4. Formularioak eta CSRF: 4.formularioak-csrf/index.md
          - 5. Datu-basea: 5.datu-basea/index.md
          - 6. Autentifikazioa eta baimena: 6.autentifikazioa-baimena/index.md
          - 7. Segurtasunez zabaltzea: 7.despliegua-segurtasunez/index.md
          - 8. Auditoretza eta egiaztapena: 8.auditoretza-eta-egiaztapena/index.md
          - 9. Laravel: 9.laravel/index.md
          - 10. Baliabideak: 10.baliabideak/index.md
          - 11. Eranskinak: 11.eranskinak/index.md
           
markdown_extensions:
- admonition
- pymdownx.tasklist:
    clickable_checkbox: true
    custom_checkbox: true
- toc:
    permalink: true
- footnotes
- tables
- attr_list
